# Radar · tráfego do servidor ao vivo
# Só local: o Apache do host publica em https://radarenchant.infinitymais.com.br
# (e encaminha /api/ para a API do mapa em 127.0.0.1:9300, em monitoring/traffic-api)
services:
  radar-enchant:
    build: .
    container_name: radar-enchant
    restart: unless-stopped
    ports:
      - "${LOCAL_HOST}:8091:80"
    mem_limit: 64m
