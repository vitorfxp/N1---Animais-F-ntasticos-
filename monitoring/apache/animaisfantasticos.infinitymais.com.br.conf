# Site Animais Fantásticos (raiz do repositório, container animais-fantasticos em 127.0.0.1:8090)
# O certbot gera o arquivo -le-ssl.conf (HTTPS) a partir deste.
<VirtualHost *:80>
    ServerName animaisfantasticos.infinitymais.com.br

    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        /     http://127.0.0.1:8090/
    ProxyPassReverse /     http://127.0.0.1:8090/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/animaisfantasticos-error.log
    CustomLog ${APACHE_LOG_DIR}/animaisfantasticos-access.log combined
</VirtualHost>
