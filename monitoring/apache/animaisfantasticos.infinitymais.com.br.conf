# Site do mapa de tráfego (container animais-fantasticos em 127.0.0.1:8090)
# /api/ -> API pública e anônima do monitoramento (127.0.0.1:9300)
# O certbot gera o arquivo -le-ssl.conf (HTTPS) a partir deste.
<VirtualHost *:80>
    ServerName animaisfantasticos.infinitymais.com.br

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:9300/api/
    ProxyPassReverse /api/ http://127.0.0.1:9300/api/
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        /     http://127.0.0.1:8090/
    ProxyPassReverse /     http://127.0.0.1:8090/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/animaisfantasticos-error.log
    # as chamadas da própria página à API (a cada 5 s) não contam como tráfego
    SetEnvIf Request_URI "^/api/" nao_logar
    CustomLog ${APACHE_LOG_DIR}/animaisfantasticos-access.log combined env=!nao_logar
</VirtualHost>
