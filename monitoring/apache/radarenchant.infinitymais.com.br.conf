# Radar · tráfego do servidor ao vivo (pasta radar_enchant/, container radar-enchant em ${LOCAL_HOST}:8091)
# /api/ -> API pública e anônima do monitoramento (${LOCAL_HOST}:9300)
# O certbot gera o arquivo -le-ssl.conf (HTTPS) a partir deste.
<VirtualHost *:80>
    ServerName radarenchant.infinitymais.com.br

    ProxyPreserveHost On
    ProxyPass        /api/ http://${LOCAL_HOST}:9300/api/
    ProxyPassReverse /api/ http://${LOCAL_HOST}:9300/api/
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        /     http://${LOCAL_HOST}:8091/
    ProxyPassReverse /     http://${LOCAL_HOST}:8091/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/radarenchant-error.log
    # as chamadas da própria página à API (a cada 5 s) não contam como tráfego
    SetEnvIf Request_URI "^/api/" nao_logar
    CustomLog ${APACHE_LOG_DIR}/radarenchant-access.log combined env=!nao_logar
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =radarenchant.infinitymais.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
