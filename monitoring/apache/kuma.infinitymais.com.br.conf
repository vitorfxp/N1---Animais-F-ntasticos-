# Uptime Kuma (serviço swarm kuma_uptime-kuma, porta 3001)
# O certbot gera o arquivo -le-ssl.conf (HTTPS) a partir deste.
<VirtualHost *:80>
    ServerName kuma.infinitymais.com.br

    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    # a interface do Kuma funciona via websocket (socket.io)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://${LOCAL_HOST}:3001/$1 [P,L]
    ProxyPass        / http://${LOCAL_HOST}:3001/
    ProxyPassReverse / http://${LOCAL_HOST}:3001/

    ErrorLog ${APACHE_LOG_DIR}/kuma-error.log
    CustomLog ${APACHE_LOG_DIR}/kuma-access.log combined
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =kuma.infinitymais.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
