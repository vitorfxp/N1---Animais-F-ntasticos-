# Grafana (instalado no host, escutando só em ${LOCAL_HOST}:3000)
# O certbot gera o arquivo -le-ssl.conf (HTTPS) a partir deste.
<VirtualHost *:80>
    ServerName grafana.infinitymais.com.br

    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    # Grafana Live (websocket)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/api/live/(.*) ws://${LOCAL_HOST}:3000/api/live/$1 [P,L]
    ProxyPass        / http://${LOCAL_HOST}:3000/
    ProxyPassReverse / http://${LOCAL_HOST}:3000/

    ErrorLog ${APACHE_LOG_DIR}/grafana-error.log
    CustomLog ${APACHE_LOG_DIR}/grafana-access.log combined
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =grafana.infinitymais.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
