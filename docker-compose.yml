
version: '3.8'
services:
  animais-fantasticos:
    build: .
    container_name: animais-fantasticos
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # Roteador HTTP -> troque o domínio pelo seu
      - "traefik.http.routers.animais.rule=Host(`animais.seudominio.com`)"
      - "traefik.http.routers.animais.entrypoints=web"

      # Porta interna do container (Nginx escuta na 80)
      - "traefik.http.services.animais.loadbalancer.server.port=80"

      # --- HTTPS (descomente se seu Traefik tiver um certresolver) ---
      # - "traefik.http.routers.animais.entrypoints=websecure"
      # - "traefik.http.routers.animais.tls=true"
      # - "traefik.http.routers.animais.tls.certresolver=letsencrypt"

networks:
  traefik:
    external: true   # rede onde o seu Traefik já está rodando
