version: '3.8'

services:
  web-app:
    build: .
    container_name: meu_projeto_web
    restart: always
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meu-app.rule=Host(`seu-subdominio.com`)"
      - "traefik.http.routers.meu-app.entrypoints=websecure"
      - "traefik.http.routers.meu-app.tls.certresolver=myresolver"
      - "traefik.http.services.meu-app.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
